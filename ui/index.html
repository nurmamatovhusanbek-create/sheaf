<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sheaf</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.mjs"></script>
</head>
<body>
  <div id="app" class="app" hidden>
    <header id="toolbar" class="toolbar" role="toolbar" aria-label="Main"></header>
    <main id="main" class="main">
      <aside id="tray" class="pane tray-pane" aria-label="Pages"></aside>
      <div class="splitter" id="split-left" role="separator" aria-orientation="vertical" tabindex="0"></div>
      <section id="preview" class="pane preview-pane" aria-label="Preview"></section>
      <div class="splitter" id="split-right" role="separator" aria-orientation="vertical" tabindex="0"></div>
      <aside id="side" class="pane side-pane" aria-label="Tools"></aside>
    </main>
    <footer id="jobbar" class="jobbar" aria-label="Jobs"></footer>
  </div>
  <div id="drop" class="drop" hidden><div class="drop-card" id="drop-text"></div></div>
  <div id="layer" class="layer"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="fatal" class="fatal" hidden role="alert"></div>
  <noscript>Sheaf needs JavaScript, which the app embeds itself.</noscript>
</body>
</html>
