# cargo-deny configuration (SEC-SUPPLY, DOC-AGENT-RULES rule 3).
# Adding a third-party crate needs a one-line justification in the PR.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
# Extend deliberately, one license at a time, as dependencies arrive.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0"]

[licenses.private]
ignore = true # the workspace's own unpublished crates

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
