[package]
name = "sheaf-jobs"
description = "MOD-JOBS: scheduler, worker pool, limits, protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sheaf-core = { path = "../sheaf-core" }
sheaf-store = { path = "../sheaf-store" }
serde.workspace = true
serde_json.workspace = true

# Protocol test double for TEST-JOBS (crash, hang, memory, priority). Never bundled.
[[bin]]
name = "sheaf-fake-worker"
path = "src/bin/fake_worker.rs"
test = false
doc = false

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security"] }
