[package]
name = "sheaf-scan"
description = "MOD-SCAN: WIA backend + fake backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sheaf-core = { path = "../sheaf-core" }
sheaf-image = { path = "../sheaf-image" }
image.workspace = true
serde_json.workspace = true

# Protocol test double for TEST-SCAN (crash, hang, abort mid-page). Never bundled.
[[bin]]
name = "sheaf-fake-scan-helper"
path = "src/bin/fake_helper.rs"
test = false
doc = false

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Devices_ImageAcquisition",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }
