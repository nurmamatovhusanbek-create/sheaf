[package]
name = "sheaf-store"
description = "MOD-STORE: session dir, cache, settings, presets, path policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sheaf-core = { path = "../sheaf-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Process hardening at start-up (SEC-ISOLATE); Windows only.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Threading"] }
