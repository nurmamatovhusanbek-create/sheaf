[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]
# tools/smoke holds scripts, not a crate.
exclude = ["tools/smoke", "tools/package", "third_party/egui-winit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "deny" # rule 5: lifted only in the PDFium/COM wrapper modules

[workspace.lints.clippy]
unwrap_used = "warn" # rule 4

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imbl = "7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "webp"] }
sha2 = "0.10"
pdfium-render = { version = "0.9.5", default-features = false, features = ["image_025", "pdfium_8125"] }
lopdf = { version = "0.47", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
zeroize = "1"
tiff = "0.11"
getrandom = "0.4"

# One change to egui-winit (see third_party/egui-winit/README-SHEAF.md): a transparent window drawn through
# DirectComposition needs to be created without a redirection bitmap.
[patch.crates-io]
egui-winit = { path = "third_party/egui-winit" }

# Build scripts compress the embedded engines; unoptimized that takes minutes.
[profile.dev.build-override]
opt-level = 3
