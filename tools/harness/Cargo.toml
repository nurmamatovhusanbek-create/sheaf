[package]
name = "harness"
description = "Headless harness: import, page ops, thumbnails, export, OCR and the perf bench, without the Tauri shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "sheaf-harness"
path = "src/main.rs"

[dependencies]
sheaf-app = { path = "../../crates/sheaf-app" }
sheaf-core = { path = "../../crates/sheaf-core" }
sheaf-store = { path = "../../crates/sheaf-store" }
sheaf-jobs = { path = "../../crates/sheaf-jobs" }
fixture-gen = { path = "../fixture-gen" }
serde_json.workspace = true
serde.workspace = true
sheaf-ocr = { path = "../../crates/sheaf-ocr" }

[dev-dependencies]
# Tests only: synthesizing text pages for the OCR fixtures.
sheaf-pdf = { path = "../../crates/sheaf-pdf" }
sheaf-image = { path = "../../crates/sheaf-image" }
tiff.workspace = true
image.workspace = true
