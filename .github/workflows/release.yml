name: release

# Publish a release, either way (the number is the one in Cargo.toml):
#   - push a tag such as v0.1.0:  git tag v0.1.0 && git push origin v0.1.0
#   - or commit the file .github/release-request containing that number (0.1.0) on the branch to
#     release: the workflow builds that commit and creates the tag and the release itself. (A manual
#     "Run workflow" button only exists for workflows on the default branch, and not every
#     environment can push tags; a plain branch push works everywhere.)
# The release carries what the in-app Update button reads (UI-UPDATE): sheaf.exe, the whole program in
# one file, and sheaf.exe.sha256 beside it; and sheaf-windows.zip for people who download it in a browser,
# where a bare .exe is often blocked or silently dropped.
on:
  push:
    tags:
      - "v*"
    # For a branch the path filter applies: only a commit that touches the request file releases.
    branches:
      - "**"
    paths:
      - ".github/release-request"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: build and publish
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The tag is the version in Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          # Pushed by tag: the tag must say the same.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
          # Pushed by request file: the file must name this version, so a stale file cannot release another.
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            asked="$(tr -d ' \r\n' < .github/release-request 2>/dev/null || true)"
            if [ "$asked" != "$version" ]; then
              echo "release-request says '$asked' but Cargo.toml says $version"; exit 1
            fi
          fi
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch and verify vendored assets
        run: bash tools/fetch-vendor
      - name: Build the app, its worker and the one-file exe
        run: |
          cargo build --release --locked -p sheaf-shell -p sheaf-worker
          cargo build --release --locked -p sheaf-onefile
          mkdir -p dist
          cp target/release/sheaf-onefile.exe dist/sheaf.exe
      - name: The one-file exe works on its own (compress a fixture from an empty folder)
        shell: pwsh
        run: |
          cargo run --release --locked -p fixture-gen --bin write-fixture -- "$env:RUNNER_TEMP\smoke.pdf" 4
          $work = Join-Path $env:RUNNER_TEMP "release-check"
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item "$env:RUNNER_TEMP\smoke.pdf" "$work\in.pdf"
          $p = Start-Process -FilePath (Resolve-Path dist\sheaf.exe) -ArgumentList "run","compress","$work\in.pdf" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the one-file exe exited with $($p.ExitCode)" }
          if (-not (Test-Path "$work\in.compressed.pdf")) { throw "the one-file exe wrote no result" }
      - name: Checksum and zip
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\sheaf.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  sheaf.exe" | Out-File -Encoding ascii -NoNewline dist\sheaf.exe.sha256
          Compress-Archive -Path dist\sheaf.exe -DestinationPath dist\sheaf-windows.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target makes the tag at this very commit when it does not exist yet (a by-hand run).
          gh release create "$TAG" dist/sheaf.exe dist/sheaf.exe.sha256 dist/sheaf-windows.zip \
            --target "$GITHUB_SHA" --title "Sheaf ${TAG#v}" --generate-notes
